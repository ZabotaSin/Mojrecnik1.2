name: Build Moj Recnik APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          # First check whether the project is already extracted somewhere.
          SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -print -quit || true)"

          # If it is still inside an uploaded ZIP, extract ZIP archives and search again.
          if [ -z "$SETTINGS_FILE" ]; then
            mapfile -t ZIP_FILES < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print)
            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo 'ERROR: No settings.gradle.kts found and no ZIP archive found.'
              find . -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
            mkdir -p extracted_project
            for archive in "${ZIP_FILES[@]}"; do
              echo "Extracting: $archive"
              unzip -o "$archive" -d extracted_project
            done
            SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -not -path './.git/*' -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo 'ERROR: ZIP archives were extracted, but settings.gradle.kts is still missing.'
            find . -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ "$PROJECT_DIR" = '.' ]; then
            echo 'PROJECT_DIR=.' >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi
          echo "Detected settings file: $SETTINGS_FILE"
          echo "Detected project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Fix Kotlin source and JVM targets
        shell: bash
        run: |
          set -euo pipefail
          FILE="$PROJECT_DIR/app/src/main/java/ru/mojrecnik/app/MainActivity.kt"
          [ -f "$FILE" ] || { echo "ERROR: Kotlin source not found: $FILE"; find "$PROJECT_DIR/app/src/main" -name '*.kt' -print; exit 1; }
          sed -i 's/singleLine = true/isSingleLine = true/g' "$FILE"

          cat > "$PROJECT_DIR/app/build.gradle.kts" <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "ru.mojrecnik.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ru.mojrecnik.app"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "1.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          GRADLE

          echo '--- app/build.gradle.kts after fix ---'
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo '--- fixed Kotlin source lines ---'
          grep -n 'isSingleLine = true' "$FILE"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MojRecnik-1.2-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

